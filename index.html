<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda de Mascotas | Accesorios para tu mascota</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a href="#" class="logo">🐾 Tienda de Mascotas</a>
      <button class="cart-btn" id="cartBtn" aria-label="Abrir carrito">
        🛒 <span id="cartCount">0</span>
      </button>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <h1>Todo lo que tu mascota necesita</h1>
      <p>Collares, camas, juguetes y accesorios de calidad para perros y gatos.</p>
      <a href="#catalogo" class="btn">Ver productos</a>
    </div>
  </section>

  <main class="container" id="catalogo">
    <h2>Catálogo</h2>
    <div class="filters" id="filters"></div>
    <div class="grid" id="products"></div>
  </main>

  <aside class="cart" id="cart" aria-hidden="true">
    <div class="cart__header">
      <h3>Tu carrito</h3>
      <button id="closeCart" aria-label="Cerrar carrito">✕</button>
    </div>
    <ul class="cart__items" id="cartItems"></ul>
    <div class="cart__footer">
      <p>Total: <strong id="cartTotal">$0.00</strong></p>
      <button class="btn" id="checkout">Finalizar compra</button>
    </div>
  </aside>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 Tienda de Mascotas. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
